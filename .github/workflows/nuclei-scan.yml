name: Nuclei Code Scan (Vite + Vue 3)

on:
  workflow_dispatch:
    inputs:
      scan_tags:
        description: '要掃描的 Nuclei Tags'
        required: true
        default: 'file,token-spray,exposure'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 提示：Vue 專案不需要像 C# 一樣先編譯（Build）才能掃描，因為我們是做純文字特徵特徵比對
      - name: Run Nuclei Scan
        uses: projectdiscovery/nuclei-action@v3
        with:
          # 使用 args 將專案根目錄 (.) 傳入，並強制開啟檔案掃描模式
          args: '-target . -type file -file -tags ${{ github.event.inputs.scan_tags }} -output report.txt'

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-frontend-report
          path: report.txt
